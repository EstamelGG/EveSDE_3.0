name: Remove old artifacts

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: write

jobs:
  clean:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: 安装项目
        run: python -m pip install -e .
      - name: 保留最近 5 个产物，删除其余超过 5 天的产物
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python -m evesde clean-artifacts --days 5 --keep 5
