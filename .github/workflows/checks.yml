name: Project checks

on:
  pull_request:
  push:
    branches: [main]
    paths:
      - 'evesde/**'
      - 'main.py'
      - 'pyproject.toml'
      - '.github/workflows/**'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - run: python -m pip install -e .
      - run: python -m compileall -q evesde main.py
      - run: python -m evesde --help
