name: Auto SDE Build and Release

on:
  workflow_dispatch:
    inputs:
      build_patch:
        description: '即使已存在相同版本的 Release，也构建下一个补丁版本'
        type: boolean
        default: false
      debug:
        description: '构建并上传检查产物，不提交历史或发布 Release'
        type: boolean
        default: false
      skip_version_check:
        description: '允许客户端与 SDE 的版本号不一致'
        type: boolean
        default: false
  schedule:
    - cron: '40 11 * * *'
    - cron: '0 13 * * *'
    - cron: '0 0 * * *'

concurrency:
  group: sde-release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      GH_TOKEN: ${{ secrets.GH_TOKEN || secrets.GITHUB_TOKEN }}
      BUILD_PATCH: ${{ inputs.build_patch || false }}
      DEBUG_MODE: ${{ inputs.debug || false }}
      SKIP_VERSION_CHECK: ${{ inputs.skip_version_check || false }}
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: 安装项目
        run: python -m pip install -e .

      - name: 确定版本与发布基线
        id: plan
        run: python -m evesde plan

      - name: 安装数据库比较工具
        if: steps.plan.outputs.should-build == 'true'
        run: sudo apt-get update && sudo apt-get install -y sqlite3-tools

      - name: 构建、生成报告并打包
        id: build
        if: steps.plan.outputs.should-build == 'true'
        run: python -m evesde build --plan tmp/build-plan.json --package

      - name: 保存检查产物
        if: steps.build.outputs.has-changes == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: sde-output-${{ steps.plan.outputs.final-build-number }}
          path: |
            ${{ steps.build.outputs.release-files }}
            ${{ steps.build.outputs.release-notes }}
            ${{ steps.build.outputs.manifest }}
            tmp/build-plan.json
            ${{ steps.build.outputs.decision }}
            output/release/release_compare_*.md
            output/item_detail
          if-no-files-found: error
          compression-level: 0
          retention-days: 5

      - name: 保存跳过发布的检查结果
        if: steps.build.outputs.has-changes == 'false'
        uses: actions/upload-artifact@v7
        with:
          name: sde-skipped-${{ steps.plan.outputs.final-build-number }}
          path: |
            ${{ steps.build.outputs.decision }}
            tmp/build-plan.json
          if-no-files-found: error
          retention-days: 5

      - name: 检出 main 用于同步历史
        if: steps.build.outputs.should-publish == 'true'
        uses: actions/checkout@v7
        with:
          ref: main
          path: repo
          token: ${{ secrets.GH_TOKEN || secrets.GITHUB_TOKEN }}

      - name: 提交历史报告与物品详情
        id: history
        if: steps.build.outputs.should-publish == 'true'
        env:
          RELEASE_MANIFEST: ${{ steps.build.outputs.manifest }}
        run: python -m evesde sync-history --manifest "$RELEASE_MANIFEST" --checkout repo --push

      - name: 发布 Release
        if: steps.build.outputs.should-publish == 'true'
        uses: softprops/action-gh-release@v3
        with:
          files: ${{ steps.build.outputs.release-files }}
          tag_name: sde-build-${{ steps.plan.outputs.final-build-number }}
          name: EVE SDE Build ${{ steps.plan.outputs.final-build-number }}
          target_commitish: ${{ github.sha }}
          body_path: ${{ steps.build.outputs.release-notes }}
          draft: false
          prerelease: false
          fail_on_unmatched_files: true
          generate_release_notes: false
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN || secrets.GITHUB_TOKEN }}

      - name: 运行摘要
        if: always()
        run: python -m evesde summary --status "${{ job.status }}"
