[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "evesde"
version = "3.0.0"
description = "EVE Online SDE multilingual database, icons and release builder"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "requests>=2.31.0",
  "orjson>=3.9.0",
  "Pillow>=10.0.0",
  "numpy>=1.24.0",
  "roman>=4.0",
  "aiohttp>=3.8.0",
  "jsondiff>=2.0.0",
]

[project.scripts]
evesde = "evesde.cli:main"

[tool.setuptools.packages.find]
include = ["evesde*"]
